openapi: 3.1.0

info:
  title: Raylane control-plane API
  version: "0.0.0-draft"
  summary: Machine-readable contract for the Raylane control plane (T005 contract batch).
  description: |
    Declarative contract for the control-plane API that the feature
    contracts define. This revision completes the T005 contract batch
    (decisions D1-D8, see `docs/engineering/foundation-decisions.md`): it
    adds authentication/session/bootstrap (D5), apply (D2/G-10),
    release-protection with helper-issued confirmation (D6/G-07),
    self-contained encrypted backup and draft-only restore (D4/G-04..G-06),
    diagnostics export (G-14), the per-protocol capability profile
    (D1/G-11), per-source LAN allowlists and forbidden-class-first fetch
    policy (D7/G-16), bounded schedule and filter vocabularies
    (G-08/G-09), destination matcher normalisation (G-13) and update-job
    counters (G-15).

    The optimistic-revision guard is now specified for every mutation class
    (D3/G-18): entity mutations carry a required client `expectedRevision`,
    refreshes carry a client `expectedRevision` plus the server-side
    `capturedRevision` commit-check, creates are guarded by absence and
    uniqueness transactionally, and generation-bound runtime operations
    carry `expectedGeneration`.

    Scope and status
    ---------------
    Retention and garbage collection remain BLOCKED: nothing in this API
    deletes revisions, drafts, secrets or audit records (cleanup stays OFF).
    The canonical-document shape (G-12) follows the compiler, which does not
    exist yet; the document is free-form until then and is not guaranteed
    secret-free.

    No endpoint in this file may be treated as implemented: no server, route
    or handler exists. The companion document
    `docs/engineering/T005-openapi.md` is the gap matrix.

    Source of truth
    ---------------
    `specs/001-selected-connections/contracts/control-plane.md` (API
    interface), `specs/001-selected-connections/data-model.md` (entities and
    states), `specs/001-selected-connections/spec.md` (FR-009, FR-010,
    FR-011, FR-013, FR-014, FR-019, FR-020, FR-021; US-01..US-05),
    `specs/001-selected-connections/plan.md` (architecture boundaries), and
    `docs/engineering/foundation-decisions.md` (D1-D8). Where a field is not
    fixed by those documents it is marked TODO in the gap matrix, not filled
    in with an assumption.

    Security invariants this contract encodes
    ------------------------------------------
    * Reads never return a secret value, and never return a raw source URL
      that may carry userinfo. Secret fields are presence-only on read; a
      source URL is returned redacted.
    * A secret update is an explicit union of unchanged / replace / clear.
      The one reserved sentinel `__RAYLANE_SECRET_UNCHANGED_V1__` is refused
      on an exact match; every other string is legitimate, including
      mask-like strings.
    * No read or write implicitly fetches a remote source, and no draft
      operation implicitly applies anything. Saving is never applying.
    * Stopping the runtime and releasing the protection against direct
      bypass are separate operations. Release requires a single-use
      confirmation issued by the helper and verified by the helper against
      its own state.
    * Error responses carry a request identifier and a stable code, and never
      echo the raw body of a remote source.

    What this contract does NOT guarantee
    --------------------------------------
    * `ConfigRevision.canonicalDocument` is a free-form object until the
      compiler fixes its shape (G-12); it is not guaranteed secret-free.
    * The enforcement of the capability profile (write validation and
      read-side filtering) is a runtime obligation; this contract records
      the profile as the source of truth but the schema alone does not
      execute the filtering.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://localhost/api/v1
    description: |
      Same-origin HTTPS listener of the control plane, on the trusted LAN only.
      The panel is not published to the internet. The host is illustrative; the
      deployment address is not fixed by any contract.

tags:
  - name: nodes
    description: Node drafts — the editable, not-yet-applied state.
  - name: revisions
    description: Immutable configuration revisions and their validation.
  - name: operations
    description: Long-running operation status.
  - name: runtime
    description: Runtime state, stop and protection release.
  - name: rules
    description: Destination rules of the active and draft configuration.
  - name: sources
    description: Subscription and rule-source settings, and explicit refresh.

paths:
  /nodes:
    get:
      operationId: listNodes
      tags: [nodes]
      summary: List node drafts.
      description: |
        Returns the editable node drafts. Secret fields are reported as
        presence only; no secret value and no raw source URL is returned.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The node drafts.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: "#/components/schemas/NodeDraft"
    post:
      operationId: createNode
      x-body-limit-bytes: 262144
      x-implementation-status: blocked
      x-implementation-note: |
        A create is the one mutation whose guard is still unresolved. The
        contract's mutation line says every mutation carries an optimistic
        revision, and the data model says the same, but the operation table
        names expectedRevision only for PATCH.
        Two readings remain, and this is a one-line decision:
          * an UNGUARDED create — a create adds a new object and overwrites
            nothing, so there is no prior revision of that object to
            compare against;
          * a guard against a COLLECTION revision — but the domain model
            has no collection-level revision entity to compare against. The
            per-entity revisions (Node, Subscription, DestinationRule) belong
            to the object being created, and ConfigRevision is the immutable
            applied revision. Introducing a collection revision would mean
            inventing an entity, which is not this artifact's call.
        The choice is not made here, and it is not resolved by assuming the
        unguarded reading.
        See gap G-18.
      tags: [nodes]
      summary: Create a node draft.
      description: |
        Creates a draft. Creating a draft never touches the running
        configuration. A node whose configuration is semantically invalid is
        still storable as an explicitly invalid draft; a syntactically invalid
        JSON body is rejected outright and does not replace a stored value.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeDraftWrite"
      responses:
        "201":
          description: The created draft.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDraft"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/SemanticValidationFailed"

  /nodes/{nodeId}:
    parameters:
      - $ref: "#/components/parameters/NodeId"
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getNode
      tags: [nodes]
      summary: Read one node draft.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The node draft.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDraft"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateNode
      x-body-limit-bytes: 262144
      tags: [nodes]
      summary: Update a node draft.
      description: |
        Optimistic concurrency: the body carries the revision the client last
        read. A stale revision is rejected with 409 and does not overwrite the
        newer state. Saving a draft never applies it.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeDraftUpdate"
      responses:
        "200":
          description: The updated draft.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDraft"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/SemanticValidationFailed"
    delete:
      operationId: deleteNode
      tags: [nodes]
      summary: Delete a node draft.
      description: |
        A node that a saved or active configuration still references cannot be
        deleted; the response lists those dependencies and the request is
        rejected with 409. Removing a reference from the draft alone does not
        release an active dependency.

        The delete is optimistic-concurrency checked: `expectedRevision` is
        required, and a revision mismatch is 409 and does not delete a node
        that changed underneath the client.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ExpectedRevision"
      responses:
        "204":
          description: The draft was deleted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /revisions/{revisionId}/validate:
    parameters:
      - $ref: "#/components/parameters/RevisionId"
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: validateRevision
      tags: [revisions]
      summary: Validate a revision without applying it.
      description: |
        Runs validation, including the engine configuration check, and returns
        a report. Validation never applies anything: the running configuration
        is untouched by this call. A validation status that was not executed is
        reported as not-run, never as passed.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The validation report.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/SemanticValidationFailed"

  /operations/{operationId}:
    parameters:
      - $ref: "#/components/parameters/OperationId"
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getOperation
      tags: [operations]
      summary: Read the status of an operation.
      description: |
        Returns the actual phase of the operation, not an assumed one. A
        failure is reported redacted.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The operation status.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /state:
    get:
      operationId: getState
      tags: [runtime]
      summary: Read the runtime state.
      description: |
        Returns the actual phase, the draft and active identifiers, and the
        readiness of each dimension. Management readiness is reported
        separately from DNS, engine and classification readiness; a running
        process is not treated as proof of readiness.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The runtime state.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeState"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /runtime/stop:
    post:
      operationId: stopRuntime
      x-body-limit-bytes: 8192
      tags: [runtime]
      summary: Stop the runtime, keeping the protection in place.
      description: |
        Stops the service and leaves the protection against direct bypass
        active. This operation never releases the protection; releasing it is
        a separate operation with a separate confirmation.

        The stop is optimistic-concurrency checked against the runtime
        generation: `expectedGeneration` is required, and a mismatch is 409
        and the stop is refused. The guard is the generation, not a release
        confirmation, so this operation does not depend on the release flow.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRuntimeRequest"
      responses:
        "202":
          description: The stop was accepted and is in progress.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /rules:
    get:
      operationId: listRules
      tags: [rules]
      summary: List destination rules.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The destination rules.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rules]
                properties:
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/DestinationRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRule
      x-body-limit-bytes: 131072
      x-implementation-status: blocked
      x-implementation-note: |
        A create is the one mutation whose guard is still unresolved. The
        contract's mutation line says every mutation carries an optimistic
        revision, and the data model says the same, but the operation table
        names expectedRevision only for PATCH.
        Two readings remain, and this is a one-line decision:
          * an UNGUARDED create — a create adds a new object and overwrites
            nothing, so there is no prior revision of that object to
            compare against;
          * a guard against a COLLECTION revision — but the domain model
            has no collection-level revision entity to compare against. The
            per-entity revisions (Node, Subscription, DestinationRule) belong
            to the object being created, and ConfigRevision is the immutable
            applied revision. Introducing a collection revision would mean
            inventing an entity, which is not this artifact's call.
        The choice is not made here, and it is not resolved by assuming the
        unguarded reading.
        See gap G-18.
      tags: [rules]
      summary: Create a destination rule in the draft.
      description: |
        Creates the rule in the draft configuration. It does not affect the
        running configuration. References are validated on write; a dangling
        reference or a cycle is rejected.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationRuleWrite"
      responses:
        "201":
          description: The created rule.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationRule"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/SemanticValidationFailed"

  /rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/RuleId"
      - $ref: "#/components/parameters/RequestId"
    patch:
      operationId: updateRule
      x-body-limit-bytes: 131072
      tags: [rules]
      summary: Update a destination rule in the draft.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationRuleUpdate"
      responses:
        "200":
          description: The updated rule.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationRule"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/SemanticValidationFailed"
    delete:
      operationId: deleteRule
      tags: [rules]
      summary: Delete a destination rule from the draft.
      description: |
        A rule referenced by the active configuration cannot be deleted; the
        response lists the dependencies and the request is rejected with 409.

        The delete is optimistic-concurrency checked: `expectedRevision` is
        required, and a revision mismatch is 409 and does not delete a rule
        that changed underneath the client.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ExpectedRevision"
      responses:
        "204":
          description: The rule was deleted from the draft.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [sources]
      summary: List subscription settings.
      description: |
        Returns the subscription settings with the URL redacted. The raw URL is
        never returned, because it may carry userinfo credentials.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The subscription settings.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [subscriptions]
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubscriptionSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSubscription
      x-body-limit-bytes: 131072
      x-implementation-status: blocked
      x-implementation-note: |
        A create is the one mutation whose guard is still unresolved. The
        contract's mutation line says every mutation carries an optimistic
        revision, and the data model says the same, but the operation table
        names expectedRevision only for PATCH.
        Two readings remain, and this is a one-line decision:
          * an UNGUARDED create — a create adds a new object and overwrites
            nothing, so there is no prior revision of that object to
            compare against;
          * a guard against a COLLECTION revision — but the domain model
            has no collection-level revision entity to compare against. The
            per-entity revisions (Node, Subscription, DestinationRule) belong
            to the object being created, and ConfigRevision is the immutable
            applied revision. Introducing a collection revision would mean
            inventing an entity, which is not this artifact's call.
        The choice is not made here, and it is not resolved by assuming the
        unguarded reading.
        See gap G-18.
      tags: [sources]
      summary: Create subscription settings.
      description: |
        Stores the settings only. Creating a subscription never fetches it.
        When the URL carries userinfo, the credentials are extracted into a
        secret reference and the raw request body is not logged.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionSettingsWrite"
      responses:
        "201":
          description: The created subscription settings.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionSettings"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/SemanticValidationFailed"

  /subscriptions/{subscriptionId}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
      - $ref: "#/components/parameters/RequestId"
    patch:
      operationId: updateSubscription
      x-body-limit-bytes: 131072
      tags: [sources]
      summary: Update subscription settings.
      description: |
        Updates the settings only; it never fetches the subscription. A
        masked URL placeholder is not a new value and is not written back —
        but that rule is enforced by server-side validation, not by this
        schema, and the placeholder's literal spelling is not specified yet
        (gap G-17). The read side is redacted, so the client cannot read the
        current URL back and must keep that state itself.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionSettingsUpdate"
      responses:
        "200":
          description: The updated subscription settings.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionSettings"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/SemanticValidationFailed"

  /rule-sources:
    get:
      operationId: listRuleSources
      tags: [sources]
      summary: List rule-source settings.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The rule-source settings.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ruleSources]
                properties:
                  ruleSources:
                    type: array
                    items:
                      $ref: "#/components/schemas/RuleSourceSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRuleSource
      x-body-limit-bytes: 131072
      x-implementation-status: blocked
      x-implementation-note: |
        A create is the one mutation whose guard is still unresolved. The
        contract's mutation line says every mutation carries an optimistic
        revision, and the data model says the same, but the operation table
        names expectedRevision only for PATCH.
        Two readings remain, and this is a one-line decision:
          * an UNGUARDED create — a create adds a new object and overwrites
            nothing, so there is no prior revision of that object to
            compare against;
          * a guard against a COLLECTION revision — but the domain model
            has no collection-level revision entity to compare against. The
            per-entity revisions (Node, Subscription, DestinationRule) belong
            to the object being created, and ConfigRevision is the immutable
            applied revision. Introducing a collection revision would mean
            inventing an entity, which is not this artifact's call.
        The choice is not made here, and it is not resolved by assuming the
        unguarded reading.
        See gap G-18.
      tags: [sources]
      summary: Create rule-source settings.
      description: |
        Stores the settings only; it never fetches the source. A source of
        ready-made lists is chosen explicitly by the administrator; there are
        no automatically trusted source URLs.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleSourceSettingsWrite"
      responses:
        "201":
          description: The created rule-source settings.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSourceSettings"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/SemanticValidationFailed"

  /rule-sources/{ruleSourceId}:
    parameters:
      - $ref: "#/components/parameters/RuleSourceId"
      - $ref: "#/components/parameters/RequestId"
    patch:
      operationId: updateRuleSource
      x-body-limit-bytes: 131072
      tags: [sources]
      summary: Update rule-source settings.
      description: |
        Updates the settings only; it never fetches the source.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleSourceSettingsUpdate"
      responses:
        "200":
          description: The updated rule-source settings.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSourceSettings"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/SemanticValidationFailed"

  /subscriptions/{subscriptionId}/refresh:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: refreshSubscription
      x-body-limit-bytes: 8192
      tags: [sources]
      summary: Refresh a subscription explicitly.
      description: |
        Starts an update job. The job updates the saved subscription
        parameters only: it never applies the result to the running network
        configuration. If a job is already running for this source, the
        request is rejected with 409 rather than overwriting it.

        Client optimistic-revision guard (D3): the request requires
        `expectedRevision` bound to the subscription's settings `revision`.
        A mismatch is 409. The server-side commit discipline is also
        normative: one running job per source, and the job commits only if
        the `capturedRevision` it recorded still matches at commit time,
        so a concurrent change after the job started rejects the candidate
        rather than overwriting it. The client guard and the server
        commit-check protect different races; neither substitutes for the
        other.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSourceRequest"
      responses:
        "202":
          description: The refresh job was accepted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /rule-sources/{ruleSourceId}/refresh:
    parameters:
      - $ref: "#/components/parameters/RuleSourceId"
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: refreshRuleSource
      x-body-limit-bytes: 8192
      tags: [sources]
      summary: Refresh a rule source explicitly.
      description: |
        Starts an update job that updates the draft version of the source
        only. An erroneous or empty result does not replace the previous set,
        and nothing is applied to the running network configuration. If a
        job is already running for this source, the request is rejected with
        409 rather than overwriting it.

        Client optimistic-revision guard (D3): the request requires
        `expectedRevision` bound to the rule source's SETTINGS `revision`
        (a distinct field from `draftVersion`/`activeVersion`, which are
        content versions of the fetched set). A mismatch is 409. The
        server-side commit discipline is also normative: one running job
        per source, and the job commits only if its `capturedRevision`
        still matches at commit time. The client guard and the server
        commit-check protect different races; neither substitutes for the
        other.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSourceRequest"
      responses:
        "202":
          description: The refresh job was accepted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /session:
    post:
      operationId: login
      x-body-limit-bytes: 4096
      tags: [auth]
      summary: Log in and establish an admin session.
      description: |
        Authenticates the administrator and sets a secure, HttpOnly,
        SameSite session cookie. On failure the response is a generic
        invalid-credentials error with a rate limit; it is never a
        per-field oracle. Session policy (D5/A04): idle 900 seconds
        (polling and reads do not extend it), absolute 43200 seconds,
        re-login required after a control-plane restart.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCredentials"
      responses:
        "204":
          description: The session was established; the cookie is set.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: logout
      tags: [auth]
      summary: Log out and revoke the current session.
      description: |
        Revokes the current session and its confirmation tokens. The
        response is idempotent.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The session was revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /bootstrap:
    post:
      operationId: bootstrap
      x-body-limit-bytes: 8192
      tags: [auth]
      summary: One-time bootstrap of the first admin.
      description: |
        Creates the first admin from a locally issued one-time token over an
        authorized local channel. Consume token + insert admin + permanent
        bootstrapConsumed is one atomic transaction; exactly one concurrent
        request wins. After an admin exists, the endpoint is closed. Session
        policy (D5): re-login is required after a control-plane restart.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "204":
          description: The admin was created and bootstrap is permanently closed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /revisions/{revisionId}/apply:
    parameters:
      - $ref: "#/components/parameters/RevisionId"
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: applyRevision
      x-body-limit-bytes: 16384
      tags: [revisions]
      summary: Apply a validated revision to the running network configuration.
      description: |
        Starts an apply of the revision (G-10, D2). Artefact bytes are
        delivered to the privileged helper with StageArtifact; the generation
        is prepared, the new-flow guard engaged, the kernel batch switched
        within one nft transaction, and the generation verified. The active
        revision is committed only on the confirmed result; a crash between
        confirmation and commit is reconciled from the apply journal. The
        apply is asynchronous and returns an operation id. An invalid
        revision is refused with 422; a revision or generation conflict is
        409.
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyRevisionRequest"
      responses:
        "202":
          description: The apply was accepted as an operation.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/SemanticValidationFailed"

  /runtime/release-protection:
    post:
      operationId: releaseProtection
      x-body-limit-bytes: 8192
      tags: [runtime]
      summary: Release the protection against direct bypass, with a bound confirmation.
      description: |
        Releases the protection (D6). Requires a single-use confirmation
        bound to the session, the generation and the protection state. The
        confirmation was issued to the authorized session by a helper
        RegisterReleaseConfirmation operation; the helper itself verifies the
        binding to the current generation and protection state, the freshness
        (at most 120 seconds) and the single use. Releasing protection is
        separate from Stop and is an authorized, confirmed, audited
        operation.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseProtectionConfirm"
      responses:
        "200":
          description: The protection was released.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /backups:
    post:
      operationId: createBackup
      x-body-limit-bytes: 4096
      tags: [backup]
      summary: Create a self-contained encrypted backup export.
      description: |
        Produces a self-contained encrypted backup file the administrator
        holds (D4). The encrypted payload carries sufficient configuration
        and secret values for restoration to a clean target. It contains no
        master key, sessions, admin credentials, release/bootstrap tokens,
        raw audit logs or passphrase. The product keeps no permanent backup
        registry. The passphrase is carried in the request body, never
        logged.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupRequest"
      responses:
        "200":
          description: The encrypted backup export.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /restores:
    post:
      operationId: restoreBackup
      x-body-limit-bytes: 71303168
      tags: [backup]
      summary: Restore an encrypted backup into a new draft revision.
      description: |
        Restores an encrypted backup into a new draft revision only, never
        applying it (D4). Authenticates/decrypts and validates
        format/version/bounds before creating state; recreates secret-store
        records under the target key and remaps references consistently in
        the same transaction as the new draft. A missing reference in a
        purportedly complete archive is an error, not a normal successful
        restore. Failure exposes no partial draft/secret records; the active
        state is unchanged.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "201":
          description: A new draft revision was created from the backup.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigRevision"
        "400":
          $ref: "#/components/responses/InvalidJson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/SemanticValidationFailed"

  /diagnostics/export:
    post:
      operationId: exportDiagnostics
      tags: [diagnostics]
      summary: Export an allowlisted nonsecret diagnostics artifact.
      description: |
        Produces a diagnostics artifact (G-14) containing only allowlisted,
        nonsecret operational state. The allowlist is fixed: it excludes
        secret values, source URLs, session/confirmation tokens, admin
        credentials and full configurations. The artifact is for support and
        debugging; it is never a substitute for a backup.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The allowlisted diagnostics artifact.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: raylane_session
      description: |
        **Placeholder only.** The cookie name, the session mechanics, the
        bootstrap path and the CSRF scheme are part of the A04 session-policy
        decision, which is partially accepted and otherwise open. This
        security scheme documents that the operations require an authenticated
        administrator session; it does **not** specify how that session is
        established, how it is protected or how CSRF is enforced. See gaps
        G-01, G-02 and G-03 in the companion document.

        The session-policy decision is INDEPENDENT of the backup A/B choice:
        G-01..G-03 depend only on the session part of A04, while G-04..G-06
        depend only on backup/restore/GC. The partial acceptance therefore
        lets the session work proceed separately from the backup work.

        The following session values are USER-ACCEPTED and are recorded here
        as the policy the implementation must honour. They do not by
        themselves make the session implementation ready:
          * idle timeout 15 minutes (900 s); polling and reads do NOT extend
            the idle deadline, and neither does a long edit without saving;
          * absolute lifetime 12 hours (43 200 s), regardless of activity;
          * after a control-plane restart, re-login is required.

        The exact activity allowlist, the limiter constants and the
        enforcement details remain PROPOSED and are not turned into
        defaults here.

        **UX condition on the accepted expiry:** loss of UNSAVED edits is
        not permitted. Before any UI is built, a mechanism for preserving and
        restoring unsaved edits across expiry, re-login and restart must be
        defined and verified. The accepted expiry does not choose that
        mechanism, and it does not permit storing secrets in browser storage
        or in logs. Expiry and authentication must not be relaxed to
        preserve edits.

        A read API that is presence-only for secrets cannot tell a client
        that a secret field is unchanged — that state must live in the
        client. This is recorded with the placeholder rule in gap G-17.

  headers:
    XRequestId:
      description: The request identifier, echoed for correlation.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Optional client-supplied request identifier, echoed in the response
        header and in error bodies. If absent, the control plane generates one.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    ExpectedRevision:
      name: expectedRevision
      in: query
      required: true
      description: |
        The revision the client based this mutation on. A mismatch is a
        409 conflict and never overwrites a newer state.

        This parameter is used by the mutations that carry no request body.
        A revision counter is not a secret, so putting it in the query
        string does not violate the rule that secrets never appear in a
        query string.
      schema:
        $ref: "#/components/schemas/Revision"
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    RuleSourceId:
      name: ruleSourceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"

  responses:
    InvalidJson:
      description: The request body is not valid JSON.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: No authenticated administrator session.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The session is authenticated but not permitted to perform this action.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The referenced object does not exist.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: |
        A stale revision, a busy resource or a dependency conflict. The body
        lists the conflicting references where the contract requires it.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: |
        The request body exceeds the limit the contract names for this
        operation. The body carries the field errors and never a secret value
        or a raw source body.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SemanticValidationFailed:
      description: |
        The request is well-formed but semantically invalid. The body carries
        the field errors and never a secret value or a raw source body.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
      description: |
        Opaque local identifier. The pattern excludes path separators and
        whitespace, so an identifier cannot express a filesystem path.

    Revision:
      type: integer
      minimum: 0
      description: |
        Optimistic-concurrency counter. A mutation states the revision it was
        based on; a mismatch is a conflict and never overwrites a newer state.

    Protocol:
      type: string
      enum: [vless, socks5, http, wireguard]
      description: |
        The selected external-node protocols. SOCKS4/SOCKS4a and a local
        public proxy server are outside this selection.

    SecretUpdate:
      description: |
        An explicit update of one secret field. `unchanged` keeps the stored
        value, `replace` sets a new one, `clear` removes it.

        **The reserved sentinel.** A client that wants to leave a secret
        untouched expresses that with `op: unchanged` — the client already
        knows whether it edited the field, because it rendered the form. The
        read API is presence-only, and that is deliberate: it protects the
        VALUE, it does not have to report whether the client edited
        anything. So `unchanged` is the only way to say "leave this alone",
        and the server never has to infer it.

        One value is reserved and refused: the exact string
        `__RAYLANE_SECRET_UNCHANGED_V1__`. If a `replace` value equals it
        exactly, the request is rejected with 422 and a field error. The
        sentinel is never stored and never echoed back.

        **Only an exact match is refused.** Any other string is a legitimate
        secret value, including strings that merely LOOK like a mask —
        `••••`, `********`, `***`, `«hidden»`. A pattern-based rejection
        would refuse legitimate passwords, so the rule is exact equality
        against the one reserved constant and nothing else.

        The schema enforces the exact-match rule directly:
        `replace.value` is `not: {const: __RAYLANE_SECRET_UNCHANGED_V1__}`,
        so a sentinel-carrying request is not schema-valid.
      oneOf:
        - type: object
          additionalProperties: false
          required: [op]
          properties:
            op:
              type: string
              const: unchanged
        - type: object
          additionalProperties: false
          required: [op, value]
          properties:
            op:
              type: string
              const: replace
            value:
              type: string
              minLength: 1
              maxLength: 4096
              not:
                const: __RAYLANE_SECRET_UNCHANGED_V1__
        - type: object
          additionalProperties: false
          required: [op]
          properties:
            op:
              type: string
              const: clear
      discriminator:
        propertyName: op
        mapping:
          unchanged: "#/components/schemas/SecretUpdateUnchanged"
          replace: "#/components/schemas/SecretUpdateReplace"
          clear: "#/components/schemas/SecretUpdateClear"

    SecretUpdateUnchanged:
      type: object
      additionalProperties: false
      required: [op]
      properties:
        op:
          type: string
          const: unchanged

    SecretUpdateReplace:
      type: object
      additionalProperties: false
      required: [op, value]
      properties:
        op:
          type: string
          const: replace
        value:
          type: string
          minLength: 1
          maxLength: 4096
          not:
            const: __RAYLANE_SECRET_UNCHANGED_V1__
          description: |
            The new secret value. The one reserved sentinel
            `__RAYLANE_SECRET_UNCHANGED_V1__` is refused: it means "leave
            this unchanged", which is expressed with `op: unchanged`
            instead. Every other string is accepted, including strings that
            look like a mask.

    SecretUpdateClear:
      type: object
      additionalProperties: false
      required: [op]
      properties:
        op:
          type: string
          const: clear

    SecretPresence:
      type: object
      additionalProperties: false
      required: [present]
      properties:
        present:
          type: boolean
          description: |
            Whether a secret value is stored. The value itself is never
            returned.

    NodeFields:
      type: object
      description: |
        The protocol-specific fields of a node. The concrete field set per
        protocol is declared in the capability profile
        (`contracts/capability-profile.json`, schema
        `contracts/capability-profile.schema.json`, decision D1), which is the
        single source of per-protocol field truth.

        Every submitted field is classified by the profile:
          * **known** — typed, validated against the profile's type, bounds,
            defaults, allowed values and dependencies; returned on read.
          * **secret** — typed, stored as a `SecretRef`, presence-only on read;
            the value never appears in any read, export, report or log outside
            the encrypted backup envelope (D4).
          * **unknown** (a field not declared in the profile) — quarantined
            encrypted (`unknownFieldsEncrypted`), never rendered, never
            compiled, and excluded from every read and export.

        Derived write validation: a field that is not declared in the profile,
        or whose value does not satisfy its declared type, bounds, allowed
        values or dependencies, is rejected on write (422) or quarantined
        (unknown) and the node is marked invalid-draft. A semantic-invalid
        draft remains saveable; malformed JSON cannot replace saved state.
        A node carrying an unresolved/unsupported capability is not applicable.

        Derived read projection: the read model returns only known nonsecret
        fields. Secret fields are returned as `SecretPresence` (presence-only)
        via the separate `secrets` map. Unknown quarantined fields are never
        returned. Never send an unknown or secret field through a free-form
        public object.
      additionalProperties: false
      required: [active, inactive, unknown]
      properties:
        active:
          type: object
          maxProperties: 256
          additionalProperties: true
          description: |
            Fields that take effect in the applied configuration. Validated
            against the capability profile on write and filtered on read.
        inactive:
          type: object
          maxProperties: 256
          additionalProperties: true
          description: |
            Declared fields stored for a possible later return, but not used by
            the compiler (the profile's `activeByDefault` is false, or the
            field is declared but `supported` is false). Switching an option
            off keeps its fields; collapsing a section is not the same as
            switching the option off.
        unknown:
          type: object
          maxProperties: 256
          additionalProperties: true
          description: |
            Fields the importer or client submitted that the capability profile
            does not declare. They are quarantined encrypted, preserved and
            never executed; the node stays explicitly invalid until the source
            or the support is fixed. Never returned on read.

    NodeValidation:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [valid-draft, invalid-draft]
          description: |
            Whether the draft may be applied. A semantically invalid
            configuration is storable as an invalid draft; applying it is
            refused with a reason.
        errors:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/ValidationIssue"
        warnings:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/ValidationIssue"

    ValidationIssue:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 256
          description: The field the issue refers to.
        message:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            A human-readable explanation. It never contains a secret value.

    NodeDraft:
      type: object
      description: The read model of a node draft.
      additionalProperties: false
      required: [id, protocol, revision, validation, fields]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        protocol:
          $ref: "#/components/schemas/Protocol"
        label:
          type: string
          maxLength: 256
        revision:
          $ref: "#/components/schemas/Revision"
        validation:
          $ref: "#/components/schemas/NodeValidation"
        fields:
          $ref: "#/components/schemas/NodeFields"
        secrets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SecretPresence"
          description: |
            Presence-only view of the node's secret fields. Values are never
            returned.
        sourceId:
          $ref: "#/components/schemas/Identifier"
        sourceKey:
          type: string
          maxLength: 256
          description: |
            The key of this node within its subscription source, when the node
            came from one.

    NodeDraftWrite:
      type: object
      description: The write model of a node draft.
      additionalProperties: false
      required: [protocol, fields]
      properties:
        protocol:
          $ref: "#/components/schemas/Protocol"
        label:
          type: string
          maxLength: 256
        fields:
          $ref: "#/components/schemas/NodeFields"
        secrets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SecretUpdate"
          description: |
            Secret updates, one entry per secret field.

            Use `op: unchanged` to leave a field alone — the client knows
            whether it edited the field. The one reserved sentinel
            `__RAYLANE_SECRET_UNCHANGED_V1__` is refused with 422 and is
            never stored or echoed; every other string, including
            mask-like strings, is a legitimate value. See the `SecretUpdate`
            description.

    NodeDraftUpdate:
      type: object
      description: |
        The patch model of a node draft. `expectedRevision` is mandatory: a
        patch without it is a conflict, because the contract requires an
        optimistic revision on every mutation.
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          $ref: "#/components/schemas/Revision"
        protocol:
          $ref: "#/components/schemas/Protocol"
        label:
          type: string
          maxLength: 256
        fields:
          $ref: "#/components/schemas/NodeFields"
        secrets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SecretUpdate"

    ConfigRevision:
      type: object
      description: |
        An immutable configuration revision. Returned by a restore (the
        restore creates a new draft revision) and reported against by
        validation. The feature contract's operation table names no
        general revision-read operation, so this schema is attached only to
        the restore response.

        The canonical document holds secret references only, never secret
        values — this is a property of the compiler that produces it, and
        it is not enforced by this schema (see `canonicalDocument` below
        and gap G-12).
      additionalProperties: false
      required: [id, revision, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        parentId:
          $ref: "#/components/schemas/Identifier"
        revision:
          $ref: "#/components/schemas/Revision"
        createdAt:
          type: string
          format: date-time
        canonicalDocument:
          type: object
          additionalProperties: true
          maxProperties: 256
          description: |
            The canonical document of this revision (G-12). Its exact shape
            follows the compiler output; the compiler contract, which does
            not exist yet, fixes the document shape and guarantees that it
            carries secret references only, never secret values.

            **This schema does not guarantee that this document is
            secret-free.** The object is free-form, so the property holds only
            to the extent that the compiler emits secret references rather
            than secret values. Until the compiler exists and its output
            shape is fixed (G-12), this document is UNVALIDATED CONTENT and
            must not be treated as a security boundary.
        validationReportId:
          $ref: "#/components/schemas/Identifier"

    ValidationReport:
      type: object
      additionalProperties: false
      required: [revisionId, status, errors, warnings]
      properties:
        revisionId:
          $ref: "#/components/schemas/Identifier"
        capabilityProfileId:
          $ref: "#/components/schemas/Identifier"
        status:
          type: string
          enum: [passed, failed, not-run]
          description: |
            The outcome of validation. A check that was not executed is
            reported as not-run and never as passed.
        errors:
          type: array
          maxItems: 512
          items:
            $ref: "#/components/schemas/ValidationIssue"
        warnings:
          type: array
          maxItems: 512
          items:
            $ref: "#/components/schemas/ValidationIssue"

    OperationPhase:
      type: string
      description: |
        The phase of an operation, as defined by the data model. The apply
        sequence is queued, validating, guarding, preparing, switching,
        verifying, active; a failure after guarding adds rolling-back and
        ends in restored or degraded-guarded. An update job runs queued,
        fetching, parsing, reconciling and ends in committed, rejected or
        failed.
      enum:
        - queued
        - validating
        - guarding
        - preparing
        - switching
        - verifying
        - active
        - rolling-back
        - restored
        - degraded-guarded
        - fetching
        - parsing
        - reconciling
        - committed
        - rejected
        - failed
        - stopped-guarded

    OperationStatus:
      type: object
      additionalProperties: false
      required: [id, phase]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        phase:
          $ref: "#/components/schemas/OperationPhase"
        appliedRevisionId:
          $ref: "#/components/schemas/Identifier"
        errorCode:
          type: string
          maxLength: 128
          description: A stable code, without a secret value.
        errorMessage:
          type: string
          maxLength: 1024
          description: |
            A redacted description of the failure. It never contains a secret
            value, a token or a raw source body.

    OperationAccepted:
      type: object
      additionalProperties: false
      required: [operationId]
      properties:
        operationId:
          $ref: "#/components/schemas/Identifier"
        phase:
          $ref: "#/components/schemas/OperationPhase"

    Readiness:
      type: object
      description: |
        Readiness of each dimension, reported separately. Management readiness
        is distinct from DNS, engine and classification readiness; a running
        process is not treated as proof of readiness.
      additionalProperties: false
      required: [management, dns, engine, classification]
      properties:
        management:
          type: boolean
        dns:
          type: boolean
        engine:
          type: boolean
        classification:
          type: boolean

    RuntimeState:
      type: object
      additionalProperties: false
      required: [phase, readiness]
      properties:
        phase:
          $ref: "#/components/schemas/OperationPhase"
        draftRevisionId:
          $ref: "#/components/schemas/Identifier"
        activeRevisionId:
          $ref: "#/components/schemas/Identifier"
        activeGeneration:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: |
            The generation of the active configuration, bounded to the JSON
            safe-integer range so that every conforming parser represents it
            exactly.
        readiness:
          $ref: "#/components/schemas/Readiness"
        lastErrorCode:
          type: string
          maxLength: 128
        lastErrorMessage:
          type: string
          maxLength: 1024
          description: A redacted description; never a secret value.

    DestinationRule:
      type: object
      description: |
        A rule that assigns matching destinations to block, direct or proxy.
      additionalProperties: false
      required: [id, kind, matcher, revision]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        kind:
          type: string
          enum: [block, direct, proxy]
        matcher:
          type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type:
              type: string
              enum: [domain, ip, cidr, set]
            value:
              type: string
              minLength: 1
              maxLength: 512
              description: |
                The matched domain, address, prefix or set reference. Its
                normalisation is documented per kind; the normalisation rules
                are not fixed by the contracts yet (gap G-13).
        outboundRef:
          $ref: "#/components/schemas/Identifier"
        revision:
          $ref: "#/components/schemas/Revision"

    DestinationRuleWrite:
      type: object
      additionalProperties: false
      required: [kind, matcher]
      properties:
        kind:
          type: string
          enum: [block, direct, proxy]
        matcher:
          type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type:
              type: string
              enum: [domain, ip, cidr, set]
            value:
              type: string
              minLength: 1
              maxLength: 512
        outboundRef:
          $ref: "#/components/schemas/Identifier"

    DestinationRuleUpdate:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          $ref: "#/components/schemas/Revision"
        kind:
          type: string
          enum: [block, direct, proxy]
        matcher:
          type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type:
              type: string
              enum: [domain, ip, cidr, set]
            value:
              type: string
              minLength: 1
              maxLength: 512
        outboundRef:
          $ref: "#/components/schemas/Identifier"

    SourceAccessMode:
      type: string
      enum: [auto, direct, proxy]
      description: |
        How the source is reached. `auto` follows the applied service route;
        when no route is applied, an automatic fetch is refused rather than
        falling back to a direct request.

    SourceSchedule:
      type: object
      description: |
        The automatic run schedule of a source (G-08). Automatic runs are off
        by default and are enabled per source. FR-014 requires manual,
        after-boot, daily, by-weekday and 1-24-hour interval scheduling. The
        kind is a closed enum; each kind uses only its own fields. Missed runs
        are coalesced into one after recovery. The schedule's time zone is
        shown explicitly in the UI.
      additionalProperties: false
      required: [automaticEnabled, kind]
      properties:
        automaticEnabled:
          type: boolean
          default: false
        kind:
          type: string
          enum: [manual, after-boot, daily, weekly, interval]
          description: |
            `manual` — no automatic runs. `after-boot` — run once after the
            control plane starts. `daily` — run at `time` each day. `weekly`
            — run at `time` on the weekdays in `weekdays`. `interval` — run
            every `intervalHours` hours.
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: |
            The time of day in 24-hour HH:MM form, interpreted in the
            explicitly displayed time zone. Required for `daily` and
            `weekly`.
        weekdays:
          type: array
          items:
            type: string
            enum: [mon, tue, wed, thu, fri, sat, sun]
          minItems: 1
          maxItems: 7
          uniqueItems: true
          description: The weekdays the schedule runs on. Required for `weekly`.
        intervalHours:
          type: integer
          minimum: 1
          maximum: 24
          description: The interval in hours. Required for `interval`.

    SubscriptionFilter:
      type: object
      description: |
        The filter applied to a subscription's nodes (G-09). FR-013 lists off,
        discard, keep and two priority modes, plus global inheritance.
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [off, discard, keep, priority-discard-first, priority-keep-first]
          description: |
            `off` — no filter. `discard` — drop nodes matching `patterns`.
            `keep` — keep only nodes matching `patterns`. `priority-discard-first`
            — evaluate discard patterns before keep patterns; a node matching
            both is discarded. `priority-keep-first` — evaluate keep patterns
            before discard patterns; a node matching both is kept.
        patterns:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
          maxItems: 256
          description: The filter patterns, applied according to the mode.
        globalInherited:
          type: boolean
          default: false
          description: |
            Whether the filter inherits the global settings. When true, the
            subscription-specific `mode` and `patterns` are ignored and the
            global filter applies.

    SubscriptionSettings:
      type: object
      description: |
        The settings of one subscription source. The URL is redacted: it may
        carry userinfo credentials, so it is never returned verbatim.
      additionalProperties: false
      required: [id, accessMode, urlPresent, schedule]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        urlPresent:
          type: boolean
          description: Whether a source URL is stored.
        urlRedacted:
          type: string
          maxLength: 512
          description: |
            A redacted rendering of the URL, without userinfo and without
            query parameters that could carry a token.
        accessMode:
          $ref: "#/components/schemas/SourceAccessMode"
        serviceRouteRef:
          $ref: "#/components/schemas/Identifier"
        tlsVerifyDisabled:
          type: boolean
          default: false
          description: |
            Whether certificate verification is disabled for this source.
            Off by default, dangerous by nature, and it applies to this source
            only — it is never propagated to other sources or to nodes.
        userAgent:
          type: string
          maxLength: 512
        filter:
          $ref: "#/components/schemas/SubscriptionFilter"
        schedule:
          $ref: "#/components/schemas/SourceSchedule"
        lanAllowlistCIDRs:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 64
          description: |
            The per-source LAN CIDR allowlist (D7/G-16). Only the
            administrator changes it; imported content never does. Forbidden
            address classes are evaluated first and always win over the
            allowlist, for IPv4 and IPv6 (including IPv4-mapped IPv6).
        revision:
          $ref: "#/components/schemas/Revision"

    SubscriptionSettingsWrite:
      type: object
      additionalProperties: false
      required: [url, accessMode]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
          description: |
            The source URL. When it carries userinfo, the credentials are
            extracted into a secret reference before the request is persisted
            or logged.
        accessMode:
          $ref: "#/components/schemas/SourceAccessMode"
        serviceRouteRef:
          $ref: "#/components/schemas/Identifier"
        tlsVerifyDisabled:
          type: boolean
          default: false
        userAgent:
          type: string
          maxLength: 512
        filter:
          $ref: "#/components/schemas/SubscriptionFilter"
        schedule:
          $ref: "#/components/schemas/SourceSchedule"
        lanAllowlistCIDRs:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 64

    SubscriptionSettingsUpdate:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          $ref: "#/components/schemas/Revision"
        url:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
          description: |
            The new source URL. A masked placeholder is not a new value and is
            not written back — but that rule is a server-side validation, not
            a schema constraint, and the placeholder's literal spelling is
            not specified yet (gap G-17). This field is write-only: the read
            model returns `urlPresent` and `urlRedacted` instead.
        accessMode:
          $ref: "#/components/schemas/SourceAccessMode"
        serviceRouteRef:
          $ref: "#/components/schemas/Identifier"
        tlsVerifyDisabled:
          type: boolean
        userAgent:
          type: string
          maxLength: 512
        filter:
          $ref: "#/components/schemas/SubscriptionFilter"
        schedule:
          $ref: "#/components/schemas/SourceSchedule"
        lanAllowlistCIDRs:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 64

    RuleSourceSettings:
      type: object
      description: |
        The settings of one rule source. As with subscriptions, the URL is
        redacted. `revision` is the SETTINGS revision (optimistic-concurrency
        guard); `draftVersion`/`activeVersion` are content versions of the
        fetched set. Client `expectedRevision` on PATCH/DELETE/refresh is
        always bound to `revision`, never to `draftVersion`/`activeVersion`.
      additionalProperties: false
      required: [id, urlPresent, schedule, revision]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        urlPresent:
          type: boolean
        urlRedacted:
          type: string
          maxLength: 512
        schedule:
          $ref: "#/components/schemas/SourceSchedule"
        draftVersion:
          type: string
          maxLength: 128
        activeVersion:
          type: string
          maxLength: 128
        lanAllowlistCIDRs:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 64
          description: |
            The per-source LAN CIDR allowlist (D7/G-16). Only the
            administrator changes it; imported content never does. Forbidden
            address classes are evaluated first and always win, for IPv4 and
            IPv6 (including IPv4-mapped IPv6).
        revision:
          $ref: "#/components/schemas/Revision"

    RuleSourceSettingsWrite:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
        schedule:
          $ref: "#/components/schemas/SourceSchedule"
        lanAllowlistCIDRs:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 64

    RuleSourceSettingsUpdate:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          $ref: "#/components/schemas/Revision"
        url:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
        schedule:
          $ref: "#/components/schemas/SourceSchedule"
        lanAllowlistCIDRs:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 64

    StopRuntimeRequest:
      type: object
      description: |
        The body of a runtime stop.

        `expectedGeneration` is required: the stop applies to the generation
        the administrator saw, and a mismatch is 409. The guard here is the
        generation, NOT a release confirmation — stopping the runtime and
        releasing the protection against direct bypass are separate
        operations, and the stop carries no release field. This body is
        independent of gap G-07, which concerns the release path only.
      additionalProperties: false
      required: [expectedGeneration]
      properties:
        expectedGeneration:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: |
            The generation the administrator believes is running. A mismatch
            against the current generation is 409 and the stop is refused.
            The boundary is the JSON safe-integer range, matching the helper
            envelope.

    RefreshSourceRequest:
      type: object
      description: |
        The body of an explicit source refresh (D3). The client optimistic-
        revision guard binds `expectedRevision` to the source's SETTINGS
        `revision` (for a rule source, the settings revision, never
        `draftVersion`/`activeVersion`). A mismatch is 409.
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          $ref: "#/components/schemas/Revision"

    SessionCredentials:
      type: object
      description: |
        Login credentials. The response is a generic invalid-credentials
        error on failure and a rate limit, never a per-field oracle.
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 1
          maxLength: 1024

    BootstrapRequest:
      type: object
      description: |
        One-time bootstrap. Carries the locally issued one-time token and the
        initial admin credentials. The bootstrap channel is a local
        authorized channel, not LAN HTTP. Consume token + insert admin +
        permanent bootstrapConsumed is one atomic transaction; exactly one
        concurrent request wins. After an admin exists, re-issuance and the
        endpoint are closed.
      additionalProperties: false
      required: [token, username, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
          description: The one-time bootstrap token, issued locally.
        username:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 1
          maxLength: 1024

    ApplyRevisionRequest:
      type: object
      description: |
        The body of an apply request (G-10/D2). Applying a revision reaches
        the privileged helper: artefact bytes are delivered with StageArtifact,
        the generation is prepared, the guard engaged, the kernel switched and
        the generation verified, and the active revision is committed only on
        the confirmed result. The apply is asynchronous and returns an
        operation id.
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 256
          description: An optional human note recorded on the apply journal.

    BackupRequest:
      type: object
      description: |
        The body of a backup request (D4). The passphrase protects the
        encrypted export; it is carried in the request body, never in a query
        string or a log. The export is a self-contained encrypted file that
        the administrator holds; the product keeps no permanent backup
        registry.
      additionalProperties: false
      required: [passphrase]
      properties:
        passphrase:
          type: string
          minLength: 8
          maxLength: 1024
          description: |
            The backup passphrase. Used to derive the encryption key via a
            standard KDF; it is never stored, logged or returned.

    RestoreRequest:
      type: object
      description: |
        The body of a restore request (D4). Carries the encrypted backup and
        its passphrase. Restore authenticates/decrypts and validates
        format/version/bounds before creating state, recreates secret-store
        records under the target key and remaps references consistently in
        the same transaction as the new draft. Failure exposes no partial
        draft/secret records; the active state is unchanged and no implicit
        apply occurs.
      additionalProperties: false
      required: [passphrase, archive]
      properties:
        passphrase:
          type: string
          minLength: 8
          maxLength: 1024
        archive:
          type: string
          minLength: 1
          maxLength: 52428800
          description: |
            The encrypted backup archive, base64-encoded, bounded to 50 MiB
            of encoded text. Validated before any state is created.

    ReleaseProtectionConfirm:
      type: object
      description: |
        The body that confirms a release of protection (D6). The confirmation
        token was issued to the authorized session by a helper
        RegisterReleaseConfirmation operation; the helper itself verifies the
        binding to the current generation and protection state, the freshness
        and the single use. `expectedGeneration` guards against replaying the
        confirmation against a generation the administrator did not intend to
        release.
      additionalProperties: false
      required: [confirmation, expectedGeneration]
      properties:
        confirmation:
          type: string
          minLength: 32
          maxLength: 512
          description: |
            The single-use confirmation token bound to the session, the
            generation and the protection state. Consumed once; a replay is
            refused without a second effect.
        expectedGeneration:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: |
            The generation the administrator believes is protected. The
            boundary is the JSON safe-integer range, matching the helper
            envelope.

    UpdateJobCounters:
      type: object
      description: |
        The counters an update job reports (G-15). Counts are informational
        and describe the job's own run, never a measured coverage claim.
      additionalProperties: false
      properties:
        fetchedBytes:
          type: integer
          minimum: 0
        nodesSeen:
          type: integer
          minimum: 0
        nodesAdded:
          type: integer
          minimum: 0
        nodesUpdated:
          type: integer
          minimum: 0
        nodesRemoved:
          type: integer
          minimum: 0
        rulesSeen:
          type: integer
          minimum: 0
        entriesKept:
          type: integer
          minimum: 0
        entriesDiscarded:
          type: integer
          minimum: 0

    DestinationMatcher:
      type: object
      description: |
        A destination matcher (G-13). Domain and IP matching is normalised in
        a documented way before comparison; the matcher value is carried with
        its kind. Unsupported-format regex or YAML tags are not executed.
      additionalProperties: false
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [domain, ip, cidr, setRef]
          description: |
            `domain` — an exact or suffix domain match, normalised to
            lowercase with a single trailing dot removed. `ip` — a single
            IPv4 or IPv6 address, normalised to its canonical form. `cidr` —
            an IPv4 or IPv6 CIDR, normalised to its network address and
            prefix length. `setRef` — a reference to a canonical destination
            set.
        value:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            The matcher value, normalised per the kind. The normalisation
            rules per kind are fixed by the compiler contract and applied
            before the value is stored or compared.

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
          description: A stable machine-readable code.
        message:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            A human-readable explanation. It never contains a secret value, a
            token, or the raw body of a remote source.
        fieldErrors:
          type: array
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field:
                type: string
                minLength: 1
                maxLength: 256
              message:
                type: string
                minLength: 1
                maxLength: 1024
        requestId:
          type: string
          minLength: 1
          maxLength: 128
          description: The request identifier, for correlation with the logs.
        dependencies:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/Identifier"
          description: |
            The saved and active references that caused a dependency
            conflict, so the caller can show what still depends on the
            object.
