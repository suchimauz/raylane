Build evidence for dnsmasq nftset (H2/R2-3): two records —
(a) noble Sources.xz Build-Depends for dnsmasq include `libnftables-dev` and
`libnetfilter-conntrack-dev [linux-any]` (check 19);
(b) noble packaging debian/rules
(`https://git.launchpad.net/ubuntu/+source/dnsmasq/plain/debian/rules?h=applied/ubuntu/noble`,
fetched HTTP 200 on 2026-10-23 19:23 UTC, check 33, artifact r1/dnsmasq-debian-rules)
contains `ifeq (,$(filter nonftset, $(DEB_BUILD_OPTIONS)))` → `COPTS += -DHAVE_NFTSET`
(plus -DHAVE_CONNTRACK) → nftset ON by default in the noble build.
This is package-build-configuration evidence, NOT a runtime
check: `dnsmasq --version` on the stand remains NOT_RUN and REQUIRED before first
use (gate restated in §7).

Feature status (design-level, runtime NOT_RUN for all):
- dnsmasq `nftset=` directives: SUPPORTED (upstream since 2.66; noble build config above).
- nftables `tproxy ip to` statement: SUPPORTED (userspace ≥0.9/kernel ≥4.18).
- iproute2 `ip rule` fwmark policy routing: SUPPORTED.
- These are external binaries invoked by the privileged helper (R-01), never linked.
- Licenses: dnsmasq GPL-2.0/GPL-3.0 (dual, per upstream COPYING); nftables GPL-2.0;
  iproute2 GPL-2.0 — runtime tools only, no license propagation into Raylane binaries.

