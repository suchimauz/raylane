## T001 vs T002 boundary (explicit, T-4)

T001 is a STATIC research baseline only. It does NOT give T002 an automatic PASS:
T002's own dependency-closure generation (go.sum, package-lock.json), build
validation and runnable checks are NOT_RUN here and must pass independently.
There is no prerequisite cycle T001→T002→T001: T001 does not depend on T002 outputs
(pins above are verified from upstream metadata, not from T002 artifacts); the
runnable baseline depends on T002 checks passing. G1 (static lock evidence) is the
only gate this package addresses; runnable G1 and G2–G4 remain OPEN.
