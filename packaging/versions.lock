Trust levels (recorded separately, per G1 — binary trust is NOT implied by a tag):
- source trust: VERIFIED — public repo, tag→commit mapping confirmed via GitHub API; commit is the release commit.
- release metadata trust: VERIFIED — official release, digest file present for all platforms.
- binary trust: PARTIAL — digests exist and are recorded above, BUT the .dgst file is unsigned (no GPG signature, no SLSA provenance attestation observed on the release). Raylane's first baseline builds Xray from the pinned source commit, so runtime does not depend on the upstream binary; the digest is recorded for the optional binary-download path only and must be re-checked at T002.
- NOT done: PGP/cosign signature verification (upstream does not publish signatures); reproducible-build comparison source↔binary.

Build provenance of upstream binary: release workflow uses `actions/setup-go@v7` with
`go-version-file: go.mod` → upstream binaries are built with the latest available
Go 1.27.x at build time, i.e. ≥ go1.27.0. Raylane builds from source with the pinned
Go version below.

Known transitive policy: go.sum at the pinned commit contains 172 entries (full pin set).
Vendoring policy for reproducibility is a T002 decision; this lock does not duplicate go.sum.

